---
# Production environment variables for Admin
env: production

# Docker settings
docker_registry: "docker.io"
docker_image_admin: "guyo254/admin"

# Container settings
admin_container_name: "havia-admin"
docker_network: "havia-network"

# Port mappings
admin_port: 3001

# Restart policies
admin_restart_policy: "always"

# Deployment directories
deploy_base_dir: "/opt/havia"
admin_deploy_dir: "{{ deploy_base_dir }}/admin"

# Backup settings
backup_enabled: true
backup_retention_days: 7

